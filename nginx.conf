server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /{
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/signupsubmit {
        proxy_pass http://192.168.0.0:5000/api/signupsubmit;
    }

    location /api/loginrequest {
        proxy_pass http://192.168.0.0:5000/api/loginrequest;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/authsession {
        proxy_pass http://192.168.0.0:5000/api/authsession;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/api {
        proxy_pass http://192.168.0.0:5000/ws/api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}